<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>电商智能助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.15);width:420px;padding:40px;text-align:center}
.card h1{font-size:28px;color:#1f2937;margin-bottom:4px}
.card .sub{font-size:14px;color:#6b7280;margin-bottom:24px}
.tabs{display:flex;margin-bottom:24px;border-bottom:2px solid #e5e7eb}
.tab{flex:1;padding:10px;cursor:pointer;font-size:15px;color:#9ca3af;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:#667eea;border-bottom-color:#667eea}
.form{display:none}.form.active{display:block}
.input-group{margin-bottom:16px;text-align:left}
.input-group label{display:block;font-size:13px;color:#374151;margin-bottom:6px;font-weight:500}
.input-group input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px;outline:none;transition:border .2s}
.input-group input:focus{border-color:#667eea}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(102,126,234,.4)}
.btn-outline{background:#fff;color:#667eea;border:2px solid #667eea;margin-top:8px}
.btn-outline:hover{background:#f5f3ff}
.msg{font-size:13px;margin-top:8px;min-height:20px}
.msg-err{color:#ef4444}.msg-ok{color:#22c55e}
.divider{display:flex;align-items:center;margin:20px 0;color:#9ca3af;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e5e7eb}
.divider span{margin:0 12px}
.admin-toggle{font-size:13px;color:#6b7280;cursor:pointer;margin-top:12px;user-select:none}
.admin-toggle:hover{color:#667eea}
.admin-section{display:none;margin-top:16px;padding-top:16px;border-top:1px solid #e5e7eb}
.admin-section.show{display:block}
</style>
</head>
<body>
<div class="card">
  <h1>电商智能助手</h1>
  <p class="sub">AI 驱动的智能购物体验</p>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">登录</div>
    <div class="tab" onclick="switchTab('register')">注册</div>
  </div>

  <div class="form active" id="form-login">
    <div class="input-group">
      <label>用户名</label>
      <input id="loginUser" type="text" placeholder="请输入用户名" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="input-group">
      <label>密码</label>
      <input id="loginPwd" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">登录</button>
    <p class="msg" id="loginMsg"></p>
  </div>

  <div class="form" id="form-register">
    <div class="input-group">
      <label>用户名</label>
      <input id="regUser" type="text" placeholder="请输入用户名(至少2个字符)" onkeydown="if(event.key==='Enter')doRegister()">
    </div>
    <div class="input-group">
      <label>密码</label>
      <input id="regPwd" type="password" placeholder="请输入密码(至少4个字符)" onkeydown="if(event.key==='Enter')doRegister()">
    </div>
    <button class="btn btn-primary" onclick="doRegister()">注册</button>
    <p class="msg" id="regMsg"></p>
  </div>

  <div class="divider"><span>或</span></div>
  <p class="admin-toggle" onclick="toggleAdmin()">管理员登录</p>

  <div class="admin-section" id="adminSection">
    <div class="input-group">
      <label>管理员密码</label>
      <input id="adminPwd" type="password" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter')adminLogin()">
    </div>
    <button class="btn btn-outline" onclick="adminLogin()">进入管理后台</button>
    <p class="msg" id="adminMsg"></p>
  </div>
</div>

<script>
function switchTab(t){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')})
  document.querySelectorAll('.form').forEach(function(x){x.classList.remove('active')})
  event.target.classList.add('active')
  document.getElementById('form-'+t).classList.add('active')
  document.getElementById('loginMsg').textContent = ''
  document.getElementById('regMsg').textContent = ''
}

async function doLogin(){
  var u = document.getElementById('loginUser').value.trim()
  var p = document.getElementById('loginPwd').value
  var el = document.getElementById('loginMsg')
  el.className = 'msg'
  if(!u){ el.className = 'msg msg-err'; el.textContent = '请输入用户名'; return }
  if(!p){ el.className = 'msg msg-err'; el.textContent = '请输入密码'; return }
  el.textContent = '登录中...'
  try{
    var r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
    var d = await r.json()
    if(d.success){
      el.className = 'msg msg-ok'; el.textContent = '登录成功，跳转中...'
      localStorage.setItem('ca_username', d.user.username)
      localStorage.setItem('ca_user_role', d.user.role)
      setTimeout(function(){ window.location.href = '/chat' }, 500)
    } else {
      el.className = 'msg msg-err'; el.textContent = d.detail || '登录失败'
    }
  }catch(e){
    el.className = 'msg msg-err'; el.textContent = '登录失败，请检查后端是否运行'
  }
}

async function doRegister(){
  var u = document.getElementById('regUser').value.trim()
  var p = document.getElementById('regPwd').value
  var el = document.getElementById('regMsg')
  el.className = 'msg'
  if(u.length < 2){ el.className = 'msg msg-err'; el.textContent = '用户名至少2个字符'; return }
  if(p.length < 4){ el.className = 'msg msg-err'; el.textContent = '密码至少4个字符'; return }
  el.textContent = '注册中...'
  try{
    var r = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
    var d = await r.json()
    if(d.success){
      el.className = 'msg msg-ok'; el.textContent = '注册成功！请切换到登录页登录'
      document.getElementById('regUser').value = ''
      document.getElementById('regPwd').value = ''
    } else {
      el.className = 'msg msg-err'; el.textContent = d.detail || '注册失败'
    }
  }catch(e){
    el.className = 'msg msg-err'; el.textContent = '注册失败，用户名可能已存在'
  }
}

function toggleAdmin(){
  var s = document.getElementById('adminSection')
  s.classList.toggle('show')
  if(s.classList.contains('show')) document.getElementById('adminPwd').focus()
}

async function adminLogin(){
  var pwd = document.getElementById('adminPwd').value
  var el = document.getElementById('adminMsg')
  el.className = 'msg'
  if(!pwd){ el.className = 'msg msg-err'; el.textContent = '请输入密码'; return }
  try{
    var r = await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})})
    var d = await r.json()
    if(d.success){
      localStorage.setItem('ca_admin_token', d.token)
      localStorage.setItem('ca_user_role', 'admin')
      window.location.href = '/admin'
    } else {
      el.className = 'msg msg-err'; el.textContent = '密码错误'
    }
  }catch(e){
    el.className = 'msg msg-err'; el.textContent = '登录失败，请检查后端是否运行'
  }
}

if(localStorage.getItem('ca_admin_token')){
  window.location.href = '/admin'
}
if(localStorage.getItem('ca_username')){
  document.getElementById('loginUser').value = localStorage.getItem('ca_username')
}
</script>
</body>
</html>
