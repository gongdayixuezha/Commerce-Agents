<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Commerce Agent</title>
<style>
:root{--bg:#f0f2f5;--surface:#fff;--text:#1f2937;--sub:#6b7280;--border:#e5e7eb;--primary:#2563eb;--primary-hover:#1d4ed8;--accent:#f59e0b;--danger:#ef4444;--sidebar-bg:#1e293b;--sidebar-text:#e2e8f0;--sidebar-hover:#334155;--shadow:0 1px 4px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0f172a;--surface:#1e293b;--text:#e2e8f0;--sub:#94a3b8;--border:#334155;--primary:#3b82f6;--primary-hover:#60a5fa;--shadow:0 1px 4px rgba(0,0,0,.3);--sidebar-bg:#0b1120;--sidebar-hover:#1e293b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
.sidebar{width:260px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-header h2{font-size:16px;margin-bottom:8px}
.sidebar-header .subtitle{font-size:11px;opacity:.6}
.btn-new{display:block;width:calc(100% - 32px);margin:12px 16px;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500}
.btn-new:hover{background:var(--primary-hover)}
.conv-list{flex:1;overflow-y:auto;padding:8px}
.conv-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sidebar-text);opacity:.8}
.conv-item:hover,.conv-item.active{background:var(--sidebar-hover);opacity:1}
.conv-item .time{font-size:10px;opacity:.5;display:block}
.conv-item .del{float:right;opacity:0;font-size:14px;line-height:1;padding:0 4px}
.conv-item:hover .del{opacity:.6}.conv-item .del:hover{opacity:1;color:var(--danger)}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12px}
.theme-toggle{background:none;border:1px solid var(--border);color:var(--sidebar-text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px}
.tab{padding:12px 20px;cursor:pointer;font-size:14px;font-weight:500;color:var(--sub);border-bottom:2px solid transparent;transition:.2s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-badge{background:var(--primary);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:6px}
.tab-content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.tab-panel{flex:1;overflow-y:auto;display:none;flex-direction:column}
.tab-panel.active{display:flex}
.chat-messages{flex:1;overflow-y:auto;padding:20px;max-width:860px;width:100%;margin:0 auto}
.msg{max-width:85%;margin-bottom:14px;padding:12px 16px;border-radius:16px;line-height:1.65;font-size:14px;animation:slideIn .3s ease}
.msg.user{background:var(--primary);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.assistant{background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.msg.assistant p{margin:4px 0}.msg.assistant code{background:var(--bg);padding:1px 5px;border-radius:3px;font-size:13px;color:var(--primary)}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.input-wrap{background:var(--surface);border-top:1px solid var(--border);padding:12px 20px 16px}
.input-inner{max-width:860px;margin:0 auto}
.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.suggest-chip{background:var(--bg);border:1px solid var(--border);padding:5px 12px;border-radius:16px;font-size:12px;cursor:pointer;color:var(--sub);transition:.2s;white-space:nowrap}
.suggest-chip:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.input-row{display:flex;gap:10px}
.input-row input{flex:1;border:1px solid var(--border);border-radius:24px;padding:10px 18px;font-size:14px;background:var(--bg);color:var(--text);outline:none}
.input-row input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.input-row button{background:var(--primary);color:#fff;border:none;border-radius:24px;padding:10px 28px;font-size:14px;cursor:pointer;font-weight:500}
.input-row button:disabled{opacity:.4;cursor:default}
.typing{display:flex;gap:5px;padding:12px 16px}.typing span{width:7px;height:7px;background:#9ca3af;border-radius:50%;animation:bounce 1.4s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}@keyframes bounce{0%,80%,100%{transform:scale(1)}40%{transform:scale(1.4)}}
a{color:var(--primary);text-decoration:underline}
.pay-btn{display:inline-block;background:#22c55e;color:#fff;padding:10px 24px;border-radius:8px;text-decoration:none!important;font-weight:600;margin-top:8px;transition:.2s}
.pay-btn:hover{background:#16a34a}
.empty-state{text-align:center;color:var(--sub);padding:60px 20px}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:20px;max-width:1100px;width:100%;margin:0 auto}
.product-card{background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);transition:.2s;cursor:pointer}
.product-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}

.product-card img{width:100%;height:180px;object-fit:cover;background:var(--bg)}
.product-card .info{padding:12px}
.product-card h3{font-size:14px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-card .meta{font-size:12px;color:var(--sub);margin-bottom:6px}
.product-card .price{font-size:20px;font-weight:700;color:var(--danger)}
.product-card .rating{color:var(--accent);font-size:13px}
.product-card .card-pay{margin-top:8px;width:100%;background:var(--primary);color:#fff;border:none;padding:8px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.product-card .card-pay:hover{background:var(--primary-hover)}
.filters{display:flex;gap:8px;padding:16px 20px 0;flex-wrap:wrap;max-width:1100px;width:100%;margin:0 auto}
.filter-chip{padding:6px 14px;border-radius:16px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.product-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100}
.product-modal .modal-content{background:var(--surface);border-radius:16px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;padding:24px}
.product-modal img{width:100%;height:240px;object-fit:cover;border-radius:8px;margin-bottom:12px}
.product-modal h2{font-size:18px;margin-bottom:8px}
.product-modal .price-big{font-size:28px;font-weight:700;color:var(--danger);margin-bottom:8px}
.product-modal .desc{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:16px}
.product-modal .modal-pay{width:100%;background:#22c55e;color:#fff;border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.product-modal .modal-pay:hover{background:#16a34a}
.product-modal .close{float:right;font-size:24px;cursor:pointer;color:var(--sub);line-height:1}
@media(max-width:768px){.sidebar{display:none}.products-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-header">
    <h2>Commerce Agent</h2>
    <div class="subtitle">AI 电商购物助手</div>
  </div>
  <button class="btn-new" onclick="newChat()">+ 新对话</button>
  <div class="conv-list" id="convList"></div>
  <div class="sidebar-footer">
    <span id="productCount">350 商品</span>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 暗色</button>
  </div>
</aside>

<main class="main">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('chat')">💬 对话</div>
    <div class="tab" onclick="switchTab('products')">🛍️ 商品<span class="tab-badge" id="badgeCount">350</span></div>
  </div>

  <div class="tab-content">
    <!-- Chat Panel -->
    <div class="tab-panel active" id="panel-chat">
      <div class="chat-messages" id="chatMsgs">
        <div class="empty-state" id="chatEmpty">
          <div class="icon">🤖</div>
          <h3>Commerce Agent</h3>
          <p style="margin-top:8px">AI 电商购物助手 · 搜索 → 对比 → 购买</p>
          <p style="margin-top:16px;font-size:13px">试试：<i>"我想买一副降噪耳机"</i></p>
        </div>
      </div>
      <div class="input-wrap">
        <div class="input-inner">
          <div class="suggestions">
            <span class="suggest-chip" onclick="quickSend(this)">降噪耳机 500以内</span>
            <span class="suggest-chip" onclick="quickSend(this)">推荐一款蓝牙音箱</span>
            <span class="suggest-chip" onclick="quickSend(this)">适合跑步的运动鞋</span>
            <span class="suggest-chip" onclick="quickSend(this)">好用的洗面奶</span>
            <span class="suggest-chip" onclick="quickSend(this)">便宜耐用的双肩包</span>
          </div>
          <div class="input-row">
            <input id="msgInput" placeholder="输入你想买的商品..." onkeydown="if(event.key==='Enter')sendMsg()" autofocus>
            <button id="sendBtn" onclick="sendMsg()">发送</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Products Panel -->
    <div class="tab-panel" id="panel-products">
      <div class="filters" id="prodFilters"></div>
      <div class="products-grid" id="prodGrid"></div>
    </div>
  </div>
</main>

<!-- Product Detail Modal -->
<div class="product-modal" id="prodModal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
var state={convs:JSON.parse(localStorage.getItem('ca_convs')||'[]'),activeConv:null,theme:localStorage.getItem('ca_theme')||'light',history:[],products:[],prodCache:null};
function applyTheme(){document.documentElement.setAttribute('data-theme',state.theme);document.querySelector('.theme-toggle').textContent=state.theme==='light'?'☾ ☾ ☾':'☀ ☀ ☀';localStorage.setItem('ca_theme',state.theme)}
function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';applyTheme()}
applyTheme();
function renderConvs(){document.getElementById('convList').innerHTML=state.convs.map((c,i)=>'<div class="conv-item'+(state.activeConv===i?' active':'')+'" onclick="switchConv('+i+')"><span class="del" onclick="event.stopPropagation();deleteConv('+i+')">×</span><span>'+escHtml(c.title||'new chat')+'</span><span class="time">'+(c.time||'')+'</span></div>').join('')}
function newChat(){var t=new Date().toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});state.convs.unshift({title:'new chat',time:t,msgs:[]});state.activeConv=0;state.history=[];saveRender();resetChat()}
function switchConv(i){state.activeConv=i;state.history=state.convs[i].msgs||[];saveRender();renderHistory()}
function deleteConv(i){state.convs.splice(i,1);state.activeConv=state.activeConv===i?null:state.activeConv>i?state.activeConv-1:state.activeConv;if(state.activeConv===null&&state.convs.length>0)state.activeConv=0;state.history=state.activeConv!==null?state.convs[state.activeConv]?.msgs||[]:[];saveRender();state.history.length?renderHistory():resetChat()}
function saveRender(){localStorage.setItem('ca_convs',JSON.stringify(state.convs));renderConvs()}
function resetChat(){document.getElementById('chatMsgs').innerHTML='<div class="empty-state"><div class="icon">🤖</div><h3>Commerce Agent</h3><p style="margin-top:8px">AI shopping assistant</p><p style="margin-top:16px;font-size:13px">try: <i>"find me noise-cancelling headphones"</i></p></div>'}
function renderHistory(){var e=document.getElementById('chatMsgs');if(!state.history.length){resetChat();return}e.innerHTML=state.history.map(function(m){return'<div class="msg '+m.role+'">'+fmtReply(m.content)+'</div>'}).join('');e.scrollTop=e.scrollHeight}
var loading=false;
async function sendMsg(){var t=document.getElementById('msgInput').value.trim();if(!t||loading)return;loading=true;document.getElementById('msgInput').value='';document.getElementById('sendBtn').disabled=true;if(state.activeConv===null)newChat();var e=document.getElementById('chatMsgs'),w=document.getElementById('chatEmpty');if(w)w.remove();e.innerHTML+='<div class="msg user">'+escHtml(t)+'</div>';e.innerHTML+='<div class="typing" id="typing"><span></span><span></span><span></span></div>';e.scrollTop=e.scrollHeight;state.history.push({role:'user',content:t});try{var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,history:state.history.slice(-12)})});var d=await r.json();state.history.push({role:'assistant',content:d.reply});document.getElementById('typing')?.remove();var hasPayment=d.reply.includes('checkout.stripe.com');
if(hasPayment){
 var div=document.createElement('div');div.className='msg assistant';div.innerHTML=fmtReply(d.reply);e.appendChild(div);
}else{
 var div=document.createElement('div');div.className='msg assistant';div.innerHTML='';e.appendChild(div);
 var i=0,txt=d.reply;
 function typeChar(){
  if(i<txt.length){div.innerHTML=fmtReply(txt.slice(0,i+5));e.scrollTop=e.scrollHeight;i+=3;setTimeout(typeChar,10)}
  else{div.innerHTML=fmtReply(txt);e.scrollTop=e.scrollHeight}
 }
 typeChar();
}if(state.activeConv!==null){var c=state.convs[state.activeConv];c.msgs=[].concat(state.history);c.title=t.slice(0,20);c.time=new Date().toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});var conv=state.convs.splice(state.activeConv,1)[0];state.convs.unshift(conv);state.activeConv=0;saveRender()}}catch(err){document.getElementById('typing')?.remove();e.innerHTML+='<div class="msg assistant">connection failed</div>'}loading=false;document.getElementById('sendBtn').disabled=false;e.scrollTop=e.scrollHeight}
function quickSend(el){document.getElementById('msgInput').value=el.textContent;sendMsg()}
function switchTab(t){console.log('switchTab:',t);document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});document.querySelectorAll('.tab-panel').forEach(function(x){x.classList.remove('active')});document.querySelector('.tab:nth-child('+(t==='chat'?1:2)+')').classList.add('active');document.getElementById('panel-'+t).classList.add('active');if(t==='products'&&!state.prodCache)loadProducts()}

var activeCat='all';
async function loadProducts(){try{var r=await fetch('/api/products?limit=350');state.products=await r.json();state.prodCache=true;document.getElementById('badgeCount').textContent=state.products.length;var cats=['all'].concat([...new Set(state.products.map(function(p){return p.category}))]);document.getElementById('prodFilters').innerHTML=cats.map(function(c){return'<span class="filter-chip'+(c===activeCat?' active':'')+'" onclick="filterProducts(\''+c+'\')">'+c+'</span>'}).join('');renderProducts()}catch(e){document.getElementById('prodGrid').innerHTML='<div class="empty-state">loading failed</div>'}}
function filterProducts(cat){activeCat=cat;document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.toggle('active',c.textContent===cat)});renderProducts()}
function renderProducts(){var f=activeCat==='all'?state.products:state.products.filter(function(p){return p.category===activeCat});document.getElementById('prodGrid').innerHTML=f.map(function(p){return'<div class="product-card" onclick="showProduct(\''+p.id+'\')"><img src="https://loremflickr.com/400/400/"+(encodeURIComponent(p.subcategory||p.category))+"?random="+p.id alt="'+escHtml(p.name)+'" loading="lazy"><div class="info"><h3>'+escHtml(p.name)+'</h3><div class="meta">'+escHtml(p.brand)+' \u00b7 sold '+p.sales_count+'</div><div class="price">\xA5'+p.price.toFixed(2)+' <span class="rating">\u2605'+p.rating+'</span></div><button class="card-pay" onclick="event.stopPropagation();quickBuy(\''+p.id+'\')">buy</button></div></div>'}).join('')}
function showProduct(pid){var p=state.products.find(function(x){return x.id===pid});if(!p)return;document.getElementById('modalContent').innerHTML='<span class="close" onclick="closeModal()">\u00d7</span><img src="https://loremflickr.com/400/400/"+(encodeURIComponent(p.subcategory||p.category))+"?random="+p.id alt="'+escHtml(p.name)+'"><h2>'+escHtml(p.name)+'</h2><div class="price-big">\xA5'+p.price.toFixed(2)+'</div><div class="meta">'+escHtml(p.brand)+' \u00b7 '+escHtml(p.category)+' \u00b7 \u2605'+p.rating+' \u00b7 sold '+p.sales_count+'</div><div class="desc">'+escHtml(p.description||'')+'</div><button class="modal-pay" onclick="quickBuy(\''+p.id+'\')">buy</button>';document.getElementById('prodModal').style.display='flex'}
function closeModal(){document.getElementById('prodModal').style.display='none'}
async function quickBuy(pid){try{var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'buy '+pid,history:[]})});var d=await r.json();var m=d.reply.match(/https?:\/\/checkout\.stripe\.com\/[^\s)]+/);if(m){window.open(m[0],'_blank')}else{alert('payment link generation failed')}}catch(e){}}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtReply(t){var h=escHtml(t);h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" class="pay-btn">$1 \uD83D\uDCB3</a>');h=h.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');return'<p>'+h+'</p>'}
renderConvs();
if(state.convs.length>0){state.activeConv=0;state.history=state.convs[0].msgs||[];renderHistory()}
fetch('/api/health').then(function(r){return r.json()}).then(function(d){document.getElementById('productCount').textContent=d.products+' products';document.getElementById('badgeCount').textContent=d.products}).catch(function(){});
</script>
</body>
</html>
