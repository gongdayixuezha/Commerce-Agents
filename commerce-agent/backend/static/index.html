<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Commerce Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;height:100vh;display:flex;flex-direction:column}
.header{background:#2563eb;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
.header .logo{width:36px;height:36px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#2563eb;font-weight:bold;font-size:18px}
.header h1{font-size:18px}.header p{font-size:11px;opacity:.8}
.chat{flex:1;overflow-y:auto;padding:20px;max-width:860px;width:100%;margin:0 auto}
.msg{max-width:85%;margin-bottom:14px;padding:12px 16px;border-radius:16px;line-height:1.65;font-size:14px}
.msg.user{background:#2563eb;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.assistant{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);border-bottom-left-radius:4px;color:#1f2937}
.msg.assistant p{margin:6px 0}
.msg.assistant code{background:#f3f4f6;padding:2px 6px;border-radius:4px;font-size:13px;color:#2563eb}
.input-area{background:#fff;padding:14px 20px;border-top:1px solid #e5e7eb;display:flex;gap:10px;max-width:860px;width:100%;margin:0 auto}
.input-area input{flex:1;border:1px solid #d1d5db;border-radius:24px;padding:10px 18px;font-size:14px;outline:none}
.input-area input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.input-area button{background:#2563eb;color:#fff;border:none;border-radius:24px;padding:10px 28px;font-size:14px;cursor:pointer;font-weight:500}
.input-area button:disabled{opacity:.4;cursor:default}
.input-area button:hover:not(:disabled){background:#1d4ed8}
.typing{display:flex;gap:5px;padding:12px 16px}.typing span{width:7px;height:7px;background:#9ca3af;border-radius:50%;animation:bounce 1.4s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}@keyframes bounce{0%,80%,100%{transform:scale(1)}40%{transform:scale(1.4)}}
a{color:#2563eb;text-decoration:underline}
</style>
</head>
<body>
<div class="header">
  <div class="logo">C</div>
  <div><h1>Commerce Agent</h1><p>AI 电商购物助手 · 搜索 → 对比 → 购买</p></div>
</div>
<div class="chat" id="chat">
  <div class="msg assistant" id="welcome"><b>你好！我是 Commerce Agent 👋</b><br><br>我可以帮你：<br>🔍 <b>搜索商品</b> — 告诉我你想买什么<br>📊 <b>对比商品</b> — 说"对比第1个和第3个"<br>💳 <b>一键支付</b> — 说"买第1个"<br><br>试试说：<i>"我想买一副降噪耳机"</i></div>
</div>
<div class="input-area">
  <input id="input" placeholder="输入你想买的商品..." onkeydown="if(event.key==='Enter')send()" autofocus>
  <button id="btn" onclick="send()">发送</button>
</div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),btn=document.getElementById('btn');
let history=[],loading=false;

async function send(){
  const text=input.value.trim();
  if(!text||loading)return;
  loading=true;input.value='';btn.disabled=true;
  chat.innerHTML+='<div class="msg user">'+esc(text)+'</div>';
  chat.innerHTML+='<div class="typing" id="typing"><span></span><span></span><span></span></div>';
  chat.scrollTop=chat.scrollHeight;
  history.push({role:'user',content:text});
  try{
    const r=await fetch('/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,history:history.slice(-12)})
    });
    const d=await r.json();
    history.push({role:'assistant',content:d.reply});
    document.getElementById('typing')?.remove();
    chat.innerHTML+='<div class="msg assistant">'+fmt(d.reply)+'</div>';
  }catch(e){
    document.getElementById('typing')?.remove();
    chat.innerHTML+='<div class="msg assistant">❌ 连接后端失败，请确认服务已启动。</div>';
  }
  loading=false;btn.disabled=false;chat.scrollTop=chat.scrollHeight;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(t){
  let h=esc(t);
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  h=h.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');
  h='<p>'+h+'</p>';
  return h;
}
</script>
</body>
</html>
